{% extends 'base.html' %}

{% block content %}
  <h1 class="text-3xl font-bold mb-6">CLIENT RETURNS PAGE</h1>

  <div class="space-y-6">
    {% for item in returns %}
      <div class="bg-white rounded-xl shadow p-6">
        <div class="flex justify-between items-center">
          <div>
            <h2 class="text-xl font-semibold">Tax Year {{ item.tax_year }}</h2>

            <p class="text-gray-500">Submitted Return</p>
          </div>

          <span class="px-4 py-2 rounded-full bg-yellow-100 text-yellow-700">{{ item.status }}</span>
        </div>

        <div class="grid grid-cols-2 gap-4 mt-6">
          <div>
            <p class="text-gray-500">Estimated Income</p>

            <p class="font-semibold">${{ item.income }}</p>
          </div>

          <div>
            <p class="text-gray-500">Due Date</p>

            <p class="font-semibold">{{ item.due_date }}</p>
          </div>
        </div>

        <div class="mt-6">
          <a href="{% url 'documents' %}" class="bg-blue-600 text-white px-5 py-2 rounded-lg">View Documents</a>
        </div>
      </div>
    {% endfor %}
  </div>
{% endblock %}
