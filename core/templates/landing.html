{% extends 'base.html' %}

{% block title %}
  AI Tax Platform
{% endblock %}

{% block content %}
  <div class="min-h-screen flex items-center justify-center">
    <div class="text-center max-w-4xl">
      <h1 class="text-5xl font-bold mb-6">AI Powered Tax Management Platform</h1>

      <p class="text-xl text-gray-600 mb-10">Simplify tax preparation with AI document analysis, CPA collaboration, and automated review.</p>

      <div class="flex justify-center gap-6">
        <a href="{% url 'select_role' 'client' %}" class="bg-blue-600 text-white px-8 py-4 rounded-lg text-lg">I'm a Client</a>

        <a href="{% url 'select_role' 'cpa' %}" class="bg-slate-900 text-white px-8 py-4 rounded-lg text-lg">I'm a CPA</a>
      </div>
    </div>
  </div>
{% endblock %}
